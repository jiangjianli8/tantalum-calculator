<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>钽铌矿计价器 · 鑫善源 🟣</title>

<style>
:root {
  --bg: #0a0a0f;
  --card: #1a1a25;
  --card2: #22222e;
  --text: #ffffff;
  --text2: #a0a0c0;
  --primary: #9c27b0;
  --primary-light: #ce93d8;
  --primary-dark: #6a1b9a;
  --gold: #ce93d8;
  --accent: #e040fb;
  --danger: #ff4466;
  --border: #2a2a3a;
  --radius: 16px;
  --radius-sm: 10px;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 16px;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: 
    radial-gradient(circle at 20% 30%, rgba(155, 0, 255, 0.05) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0, 45, 255, 0.05) 0%, transparent 40%);
  pointer-events: none;
  z-index: 0;
  animation: bgFloat 20s ease-in-out infinite;
}

@keyframes bgFloat {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(1%, -1%); }
}

.container { width:100%; max-width:520px; position: relative; z-index: 1; }

.header {
  text-align: center;
  padding: 24px 0 20px;
}

.header h1 {
  font-size: 2rem;
  font-weight: 900;
  background: linear-gradient(135deg, var(--primary-light), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 1px;
}

.header .subtitle {
  font-size: 0.8rem;
  color: var(--text2);
  margin-top: 6px;
  letter-spacing: 1px;
}

.header .source-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  vertical-align: middle;
  margin-right: 4px;
}

.header .source-dot.live {
  background: #00ff88;
  box-shadow: 0 0 10px #00ff88;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%,100% { opacity:1; }
  50% { opacity:0.4; }
}

.price-card {
  background: linear-gradient(135deg, rgba(255,107,53,0.08), rgba(199,62,29,0.06));
  border: 1px solid var(--primary-dark);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(10px);
}

.price-card::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -30%;
  width: 140px;
  height: 140px;
  background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
  opacity: 0.12;
  border-radius: 50%;
  animation: priceGlow 4s ease-in-out infinite;
}

@keyframes priceGlow {
  0%, 100% { transform: scale(1); opacity: 0.08; }
  50% { transform: scale(1.1); opacity: 0.15; }
}

.price-label {
  font-size: 0.75rem;
  color: var(--primary-light);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.price-label .dot {
  width: 8px; height: 8px;
  background: #00ff88;
  border-radius: 50%;
  animation: pulse 2s infinite;
  box-shadow: 0 0 8px #00ff88;
}

.price-value {
  font-size: 2.2rem;
  font-weight: 800;
  color: var(--primary-light);
  line-height: 1;
  background: linear-gradient(135deg, var(--primary-light), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.price-value .unit {
  font-size: 0.9rem;
  font-weight: 400;
  color: var(--text2);
  margin-left: 4px;
  -webkit-text-fill-color: var(--text2);
}

.price-meta {
  font-size: 0.7rem;
  color: var(--text2);
  margin-top: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.refresh-btn {
  background: rgba(255,107,53,0.15);
  border: 1px solid var(--primary-dark);
  color: var(--primary-light);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.7rem;
  cursor: pointer;
  transition: all 0.3s;
  font-weight: 600;
}

.refresh-btn:hover {
  background: rgba(255,107,53,0.25);
  box-shadow: 0 0 15px rgba(255,107,53,0.3);
}

.refresh-btn:active { transform: scale(0.95); }

.manual-price {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  font-size: 0.75rem;
}

.manual-price input {
  background: var(--card2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  border-radius: 8px;
  width: 120px;
  font-size: 0.8rem;
  text-align: center;
}

.manual-price input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(255,107,53,0.15);
}

.manual-price button {
  background: var(--primary-dark);
  border: none;
  color: #fff;
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 0.7rem;
  cursor: pointer;
  font-weight: 600;
}

.manual-price .toggle {
  font-size: 0.65rem;
  color: var(--primary-light);
  cursor: pointer;
  text-decoration: underline;
}

.calc-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  transition: all 0.3s;
}

.calc-card:hover {
  border-color: var(--primary-dark);
  box-shadow: 0 0 20px rgba(255,107,53,0.1);
}

.calc-card h2 {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--text2);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.calc-card h2::before {
  content: '';
  width: 3px;
  height: 16px;
  background: linear-gradient(180deg, var(--primary), var(--primary-light));
  border-radius: 2px;
}

.calc-card h2 .icon { font-size: 1.2rem; }

.grade-section { margin-bottom: 20px; }

.grade-label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
}

.grade-label .name { font-size: 0.8rem; color: var(--text2); letter-spacing: 0.5px; }

.grade-label .value {
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--primary-light);
  background: linear-gradient(135deg, var(--primary-light), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.grade-label .value .pct {
  font-size: 1rem;
  color: var(--text2);
  -webkit-text-fill-color: var(--text2);
}

.slider-wrap {
  position: relative;
  padding: 8px 0;
}

input[type=range] {
  -webkit-appearance: none;
  width: 100%;
  height: 10px;
  border-radius: 5px;
  background: linear-gradient(90deg, var(--primary-dark), var(--primary), var(--gold));
  outline: none;
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--primary-light);
  border: 3px solid #fff;
  cursor: pointer;
  box-shadow: 0 2px 12px var(--primary);
  transition: all 0.2s;
}

input[type=range]::-webkit-slider-thumb:hover {
  transform: scale(1.1);
  box-shadow: 0 4px 20px var(--primary);
}

.grade-ticks {
  display: flex;
  justify-content: space-between;
  font-size: 0.65rem;
  color: var(--text2);
  padding: 4px 8px 0;
}

.grade-presets {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.grade-presets button {
  background: var(--card2);
  border: 1px solid var(--border);
  color: var(--text2);
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 0.7rem;
  cursor: pointer;
  transition: all 0.2s;
  font-weight: 600;
}

.grade-presets button:hover {
  border-color: var(--primary);
  color: var(--primary-light);
  background: rgba(255,107,53,0.1);
}

.grade-presets button.active {
  background: rgba(255,107,53,0.2);
  border-color: var(--primary);
  color: var(--primary-light);
  box-shadow: 0 0 10px rgba(255,107,53,0.2);
}

.coeff-display {
  background: var(--card2);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid var(--border);
}

.coeff-display .label { font-size: 0.8rem; color: var(--text2); letter-spacing: 0.5px; }

.coeff-display .value {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--accent);
  text-shadow: 0 0 10px rgba(0,240,255,0.2);
}

.result-card {
  background: linear-gradient(135deg, rgba(255,107,53,0.1), rgba(199,62,29,0.08));
  border: 2px solid var(--primary-dark);
  border-radius: var(--radius);
  padding: 24px 20px;
  text-align: center;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}

.result-card::before {
  content: '';
  position: absolute;
  top: -50%;
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, var(--gold) 0%, transparent 70%);
  opacity: 0.08;
  border-radius: 50%;
}

.result-card .label {
  font-size: 0.8rem;
  color: var(--primary-light);
  margin-bottom: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.result-card .value {
  font-size: 2.8rem;
  font-weight: 900;
  color: var(--gold);
  line-height: 1;
  text-shadow: 0 0 20px rgba(255,215,0,0.3);
  position: relative;
  z-index: 1;
}

.result-card .unit {
  font-size: 0.9rem;
  font-weight: 400;
  color: var(--text2);
}

.result-formula {
  font-size: 0.7rem;
  color: var(--text2);
  margin-top: 12px;
  line-height: 1.6;
}

.coeff-table-wrap {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s ease;
}

.coeff-table-wrap.open { max-height: 600px; }

.coeff-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.75rem;
  margin-top: 12px;
}

.coeff-table th, .coeff-table td {
  padding: 10px 12px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}

.coeff-table th {
  color: var(--text2);
  font-weight: 600;
  font-size: 0.7rem;
  background: var(--card2);
}

.coeff-table tr:hover td { background: rgba(255,107,53,0.08); }

.coeff-table tr.current td {
  background: rgba(255,107,53,0.18);
  color: var(--primary-light);
  font-weight: 700;
}

.toggle-table-btn {
  width: 100%;
  background: none;
  border: 1px dashed var(--border);
  color: var(--text2);
  padding: 10px;
  border-radius: 10px;
  font-size: 0.7rem;
  cursor: pointer;
  margin-top: 10px;
  transition: all 0.2s;
}

.toggle-table-btn:hover {
  border-color: var(--primary);
  color: var(--primary-light);
  background: rgba(255,107,53,0.05);
}

.multi-ores { margin-top: 20px; }

.multi-ores h3 {
  font-size: 0.85rem;
  color: var(--text2);
  margin-bottom: 10px;
  letter-spacing: 0.5px;
}

.ore-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
  padding: 12px;
  background: var(--card2);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  transition: all 0.2s;
}

.ore-row:hover {
  border-color: var(--primary-dark);
}

.ore-row .ore-grade {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
}

.ore-row input {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px;
  border-radius: 8px;
  width: 80px;
  font-size: 0.85rem;
  text-align: center;
  font-weight: 600;
}

.ore-row input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(255,107,53,0.15);
}

.ore-row .ore-result {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--primary-light);
  min-width: 100px;
  text-align: right;
}

.ore-row .ore-del {
  background: none;
  border: none;
  color: var(--danger);
  cursor: pointer;
  font-size: 1.4rem;
  padding: 0 4px;
  line-height: 1;
}

.add-ore-btn {
  width: 100%;
  background: none;
  border: 1px dashed var(--border);
  color: var(--text2);
  padding: 10px;
  border-radius: 10px;
  font-size: 0.7rem;
  cursor: pointer;
  margin-bottom: 10px;
  transition: all 0.2s;
}

.add-ore-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(0,240,255,0.05);
}

.total-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px;
  background: rgba(255,107,53,0.12);
  border-radius: var(--radius-sm);
  border: 1px solid var(--primary-dark);
}

.total-row .label { font-size: 0.85rem; color: var(--primary-light); font-weight: 600; }

.total-row .value {
  font-size: 1.3rem;
  font-weight: 800;
  color: var(--gold);
  text-shadow: 0 0 10px rgba(255,215,0,0.2);
}

.footer {
  text-align: center;
  padding: 20px 16px;
  font-size: 0.7rem;
  color: var(--text2);
  letter-spacing: 1px;
}

.footer span {
  font-weight: 900;
  color: var(--primary);
  font-size: 1.1rem;
}

.price-error {
  color: var(--danger);
  font-size: 0.7rem;
}

/* 钽铌矿特有样式 - 复用镍矿石的大部分样式 */
.ore-type, .mode-toggle {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.ore-type button, .mode-toggle button {
  flex: 1;
  padding: 12px 8px;
  background: var(--card2);
  border: 1px solid var(--border);
  color: var(--text2);
  border-radius: var(--radius-sm);
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.3s;
  font-weight: 600;
}

.ore-type button:hover, .mode-toggle button:hover {
  border-color: var(--primary);
  color: var(--primary-light);
}

.ore-type button.active, .mode-toggle button.active {
  background: rgba(156,39,176,0.15);
  border-color: var(--primary);
  color: var(--primary-light);
  font-weight: 700;
  box-shadow: 0 0 15px rgba(156,39,176,0.2);
}

.param-row {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
}

.param-item {
  flex: 1;
  background: var(--card2);
  border-radius: var(--radius-sm);
  padding: 12px;
  text-align: center;
  border: 1px solid var(--border);
}

.param-item .lbl {
  font-size: 0.68rem;
  color: var(--text2);
  margin-bottom: 6px;
  letter-spacing: 0.3px;
}

.param-item .v {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--accent);
  text-shadow: 0 0 8px rgba(224,64,251,0.2);
}

.param-item input {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 8px;
  border-radius: 8px;
  width: 90px;
  font-size: 0.8rem;
  text-align: center;
  font-weight: 600;
}

.param-item input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(156,39,176,0.15);
}

.tax-toggle {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding: 12px 16px;
  background: var(--card2);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}

.tax-toggle .lbl {
  font-size: 0.75rem;
  color: var(--text2);
  letter-spacing: 0.3px;
}

.toggle-sw {
  position: relative;
  width: 48px;
  height: 26px;
}

.toggle-sw input { opacity: 0; width: 0; height: 0; }

.toggle-sw .slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--border);
  border-radius: 26px;
  transition: 0.3s;
}

.toggle-sw .slider:before {
  content: "";
  position: absolute;
  height: 20px;
  width: 20px;
  left: 3px;
  bottom: 3px;
  background: #fff;
  border-radius: 50%;
  transition: 0.3s;
}

.toggle-sw input:checked + .slider {
  background: var(--primary);
  box-shadow: 0 0 10px rgba(156,39,176,0.3);
}

.toggle-sw input:checked + .slider:before {
  transform: translateX(22px);
}

.toggle-manual {
  font-size: 0.65rem;
  color: var(--text2);
  cursor: pointer;
  margin-top: 4px;
  display: inline-block;
}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>钽铌矿计价计算器</h1>

    <div class="subtitle">Ta&#8322;O&#8325; / Nb&#8322;O&#8325; · CIF 到岸价 · 实时汇率</div>

  </div>



  <div class="price-card">

    <div class="price-label">

      <span class="dot" id="statusDot"></span>

      <span>SMM 上海有色网 · 30% 钽铌矿行情</span>

    </div>

    <div class="price-value" id="priceDisplay"><span class="spinner"></span></div>

    <div class="price-meta">

      <span id="priceTime">加载中...</span>

      <button class="refresh-btn" onclick="fetchPrice()">刷新</button>

    </div>

    <div class="manual-price" id="manualPriceRow" style="display:none">

      <span>手动：</span>

      <input type="number" id="manualPriceInput" placeholder="美元/磅" step="0.01">

      <button onclick="setManualPrice()">确定</button>

      <span class="toggle" onclick="resetPrice()">恢复默认</span>

    </div>

    <div class="manual-price" style="margin-top:6px">

      <span class="toggle" onclick="toggleManualPrice()" style="font-size:.7rem;color:var(--text2)">✎ 手动输入价格</span>

    </div>

    <div class="fx-row">

      <span>实时汇率 USD/CNY</span>

      <span class="fx-value" id="fxDisplay">加载中...</span>

    </div>

  </div>



  <div class="calc-card">

    <h2><span class="icon">🧮</span>计价计算</h2>

    <div class="grade-section">

      <div class="grade-label">

        <span class="name">钽铌矿品位 (Ta₂O₅+Nb₂O₅)</span>

        <span class="value" id="gradeValue">30<span class="pct">%</span></span>

      </div>

      <div class="slider-wrap">

        <input type="range" id="gradeSlider" min="1" max="50" value="30" step="0.1" oninput="updateCalc()">

      </div>

      <div class="grade-ticks"><span>1%</span><span>10%</span><span>20%</span><span>30%</span><span>40%</span><span>50%</span></div>

    </div>

    <div class="presets" id="gradePresets"></div>

    <div class="vat-section">

      <span class="label">增值税率</span>

      <input type="number" id="vatRate" value="13" min="0" max="20" step="0.5" onchange="updateCalc()">

      <span class="suffix">%</span>

    </div>

    <div class="results">

      <div class="result-item">

        <span class="r-label">CIF 到岸价</span>

        <span><span class="r-value" id="cifPrice">-</span> <span class="r-unit">美元/吨</span></span>

      </div>

      <div class="result-item">

        <span class="r-label">国内税前价</span>

        <span><span class="r-value" id="pretaxPrice">-</span> <span class="r-unit">元/吨</span></span>

      </div>

      <div class="result-item highlight">

        <span class="r-label">国内税后价</span>

        <span><span class="r-value" id="aftertaxPrice">-</span> <span class="r-unit">元/吨</span></span>

      </div>

      <div class="result-item">

        <span class="r-label">吨度价</span>

        <span><span class="r-value" id="tonDegreePrice">-</span> <span class="r-unit">元/吨度</span></span>

      </div>

    </div>

  </div>



  <div class="footer">

    <span>矿链通1.0</span>

    <span>-佛山鑫善源</span>

  </div>

</div>



<script>

var basePrice=232.5,exchangeRate=7.25,manualOverride=false,LBS_PER_TON=2204.6226;

function fetchPrice(){

  var d=document.getElementById("priceDisplay"),t=document.getElementById("priceTime"),dot=document.getElementById("statusDot");

  d.innerHTML='<span class="spinner"></span>';dot.style.background="#daa520";

  fetch("data/price.json?t="+Date.now()).then(function(r){return r.json()}).then(function(data){

    if(data.intl_price&&data.intl_price>0&&!manualOverride)basePrice=data.intl_price;

    if(data.exchange_rate&&data.exchange_rate>0){exchangeRate=data.exchange_rate;document.getElementById("fxDisplay").textContent=exchangeRate.toFixed(4)}

    d.innerHTML="$"+basePrice.toFixed(1)+'<span class="unit">/磅</span>';

    t.textContent=data.updated_at?"更新于 "+data.updated_at:"实时数据";

    dot.style.background="#4caf50";updateCalcDisplay()

  }).catch(function(){useDefaults(d,t,dot);fetchLiveFX()});

  fetchLiveFX()

}

function fetchLiveFX(){

  fetch("https://open.er-api.com/v6/latest/USD").then(function(r){return r.json()}).then(function(data){

    if(data.rates&&data.rates.CNY>0){exchangeRate=data.rates.CNY;document.getElementById("fxDisplay").textContent=exchangeRate.toFixed(4);updateCalcDisplay()}

  }).catch(function(){})

}

function useDefaults(d,t,dot){

  d.innerHTML="$"+basePrice.toFixed(1)+'<span class="unit">/磅</span>';

  t.innerHTML='<span class="price-error">离线模式 · 使用默认参考价</span>';

  document.getElementById("fxDisplay").textContent=exchangeRate.toFixed(4)+" (默认)";

  dot.style.background="#e05555";updateCalcDisplay()

}

function updateCalcDisplay(){if(!manualOverride)updateCalc()}

function setManualPrice(){

  var v=parseFloat(document.getElementById("manualPriceInput").value);

  if(v>0){basePrice=v;manualOverride=true;

    document.getElementById("priceDisplay").innerHTML="$"+v.toFixed(1)+'<span class="unit">/磅</span>';

    document.getElementById("priceTime").textContent="手动输入价格";updateCalc()}

}

function resetPrice(){manualOverride=false;fetchPrice()}

function toggleManualPrice(){

  var r=document.getElementById("manualPriceRow");

  r.style.display=r.style.display==="none"?"flex":"none"

}

function updateCalc(){

  var g=parseFloat(document.getElementById("gradeSlider").value);

  var vat=parseFloat(document.getElementById("vatRate").value)||0;

  document.getElementById("gradeValue").innerHTML=g.toFixed(1)+'<span class="pct">%</span>';

  updatePresetButtons(g);

  var cif=basePrice*LBS_PER_TON*(g/100);

  var pretax=cif*exchangeRate;

  var aftertax=pretax*(1+vat/100);

  var td=g>0?aftertax/g:0;

  document.getElementById("cifPrice").textContent=cif.toFixed(2);

  document.getElementById("pretaxPrice").textContent=pretax.toFixed(2);

  document.getElementById("aftertaxPrice").textContent=aftertax.toFixed(2);

  document.getElementById("tonDegreePrice").textContent=td.toFixed(2);

  updateMultiOres()

}

function buildPresetButtons(){

  var c=document.getElementById("gradePresets");

  [5,10,15,20,25,30,35,40,45,50].forEach(function(g){

    var b=document.createElement("button");b.textContent=g+"%";

    b.onclick=function(){document.getElementById("gradeSlider").value=g;updateCalc()};

    c.appendChild(b)

  })

}

function updatePresetButtons(grade){

  document.querySelectorAll("#gradePresets button").forEach(function(b){

    var g=parseInt(b.textContent);

    b.classList.toggle("active",Math.abs(g-grade)<0.05)

  })

}

var oreRows=[30,25,20];

function renderOreRows(){

  var l=document.getElementById("oreList");if(!l)return;l.innerHTML="";

  var vat=parseFloat(document.getElementById("vatRate").value)||0;

  oreRows.forEach(function(g,i){

    var cif=basePrice*LBS_PER_TON*(g/100),pretax=cif*exchangeRate,aftertax=pretax*(1+vat/100);

    l.innerHTML+='<div class="ore-row"><span style="font-size:.7rem;color:var(--text2)">品位</span>'

      +'<div class="ore-grade"><input type="number" value="'+g+'" min="1" max="50" step="0.1" onchange="updateOreGrade('+i+',this.value)">'

      +'<span style="font-size:.75rem;color:var(--text2)">%</span></div>'

      +'<div class="ore-result">¥'+aftertax.toFixed(0)+' /吨</div>'

      +'<button class="ore-del" onclick="removeOreRow('+i+')">×</button></div>'

  });updateTotal()

}

function addOreRow(){oreRows.push(30);document.getElementById("totalRow").style.display="flex";renderOreRows()}

function removeOreRow(i){oreRows.splice(i,1);if(oreRows.length<=1)document.getElementById("totalRow").style.display="none";renderOreRows()}

function updateOreGrade(i,v){var g=parseFloat(v);if(isNaN(g)||g<1)g=1;if(g>50)g=50;oreRows[i]=g;renderOreRows()}

function updateMultiOres(){renderOreRows()}

function updateTotal(){

  var total=0,vat=parseFloat(document.getElementById("vatRate").value)||0;

  oreRows.forEach(function(g){total+=basePrice*LBS_PER_TON*(g/100)*exchangeRate*(1+vat/100)});

  var e=document.getElementById("totalPrice");if(e)e.textContent="¥"+total.toFixed(0)+" /吨"

}

function init(){buildPresetButtons();updateCalc();fetchPrice();setInterval(fetchPrice,60000);setInterval(fetchLiveFX,300000)}

init();

</script>

</body>

</html>
