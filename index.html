<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>钽铌矿计价器 · 鑫善源 💎</title>

<style>

/* ===== 全局变量 - 钽铌矿计价器霓虹主题 ===== */
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-card: #1a1a25;
  --bg-card-hover: #1f1f2e;
  --border-glow: #00d4aa80;
  --neon-purple: #00d4aa;
  --neon-blue: #009975;
  --neon-cyan: #00f0ff;
  --neon-green: #4ecdc4;
  --neon-pink: #ff0080;
  --neon-gold: #ffd700;
  --text-primary: #ffffff;
  --text-secondary: #a0a0c0;
  --text-muted: #606080;
  --success: #4ecdc4;
  --danger: #ff4466;
  --warning: #ffaa00;
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--bg-primary);
  min-height: 100vh;
  color: var(--text-primary);
  padding-bottom: 40px;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: 
    radial-gradient(circle at 20% 30%, rgba(155, 0, 255, 0.06) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0, 45, 255, 0.06) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.03) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
  animation: bgFloat 20s ease-in-out infinite;
}

@keyframes bgFloat {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  33% { transform: translate(2%, -2%) rotate(1deg); }
  66% { transform: translate(-2%, 2%) rotate(-1deg); }
}

.header {
  background: linear-gradient(135deg, rgba(155, 0, 255, 0.12) 0%, rgba(0, 45, 255, 0.12) 100%);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(155, 0, 255, 0.25);
  color: #fff;
  padding: 20px 16px 16px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 30px rgba(155, 0, 255, 0.15);
}

.header h1 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 2px;
  background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan), var(--neon-blue));
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: gradientShift 3s ease infinite;
}

@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.header .sub {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.header .brand {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

.source-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  vertical-align: middle;
}

.source-dot.live {
  background: var(--neon-green);
  box-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-green);
  animation: pulse 2s ease-in-out infinite;
}

.source-dot.delayed {
  background: var(--warning);
  box-shadow: 0 0 8px var(--warning);
}

.source-dot.offline {
  background: var(--text-muted);
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.2); }
}

.container {
  padding: 16px 12px;
  max-width: 500px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

.card {
  background: var(--bg-card);
  border: 1px solid rgba(155, 0, 255, 0.15);
  border-radius: var(--radius-lg);
  padding: 18px 16px;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(155, 0, 255, 0.08), transparent);
  transition: left 0.6s ease;
}

.card:hover::before { left: 100%; }

.card:hover {
  border-color: rgba(155, 0, 255, 0.4);
  box-shadow: 0 0 20px rgba(155, 0, 255, 0.15), 0 8px 32px rgba(0, 0, 0, 0.4);
  transform: translateY(-2px);
}

.card-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-secondary);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.card-title::before {
  content: '';
  width: 3px;
  height: 16px;
  background: linear-gradient(180deg, var(--neon-purple), var(--neon-cyan));
  border-radius: 2px;
}

.price-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: linear-gradient(135deg, rgba(155, 0, 255, 0.08) 0%, rgba(0, 45, 255, 0.08) 100%);
  border: 1px solid rgba(155, 0, 255, 0.2);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
}

.price-bar::after {
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 150px;
  height: 150px;
  background: radial-gradient(circle, rgba(0, 240, 255, 0.12) 0%, transparent 70%);
  border-radius: 50%;
  animation: priceGlow 4s ease-in-out infinite;
}

@keyframes priceGlow {
  0%, 100% { transform: scale(1); opacity: 0.5; }
  50% { transform: scale(1.1); opacity: 0.8; }
}

.price-bar .price {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: -1px;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  position: relative;
  z-index: 1;
}

.price-bar .change {
  font-size: 12px;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 6px;
  position: relative;
  z-index: 1;
}

.price-bar .change.up {
  color: var(--danger);
  background: rgba(255, 68, 102, 0.12);
  border: 1px solid rgba(255, 68, 102, 0.25);
}

.price-bar .change.down {
  color: var(--success);
  background: rgba(0, 255, 136, 0.12);
  border: 1px solid rgba(0, 255, 136, 0.25);
}

.price-bar .status {
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 4px;
  font-weight: 700;
  position: relative;
  z-index: 1;
}

.price-bar .status.realtime {
  background: rgba(0, 240, 255, 0.12);
  color: var(--neon-cyan);
  border: 1px solid rgba(0, 240, 255, 0.25);
}

.price-bar .status.closed {
  background: rgba(96, 96, 128, 0.15);
  color: var(--text-muted);
  border: 1px solid rgba(96, 96, 128, 0.25);
}

.price-bar .refresh {
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  padding: 6px 12px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
  color: #fff;
  border: none;
  transition: all 0.3s ease;
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 36px;
  min-height: 36px;
}

.price-bar .refresh:hover {
  box-shadow: 0 0 20px rgba(155, 0, 255, 0.4);
  transform: scale(1.05);
}

.price-bar .refresh:active { transform: scale(0.95); }

.price-bar .refresh.loading { animation: spin 1s linear infinite; }

@keyframes spin { to { transform: rotate(360deg); } }

.quick-presets {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.preset-chip {
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  background: rgba(96, 96, 128, 0.15);
  color: var(--text-secondary);
  border: 1.5px solid rgba(96, 96, 128, 0.25);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

.preset-chip:hover {
  background: rgba(155, 0, 255, 0.12);
  border-color: rgba(155, 0, 255, 0.35);
  color: var(--text-primary);
  transform: translateY(-1px);
}

.preset-chip.active {
  background: linear-gradient(135deg, rgba(155, 0, 255, 0.25), rgba(0, 45, 255, 0.25));
  border-color: var(--neon-purple);
  color: var(--text-primary);
  box-shadow: 0 0 15px rgba(155, 0, 255, 0.25);
}

.form-row { display: flex; gap: 10px; margin-bottom: 10px; }
.form-row .field { flex: 1; }
.field { margin-bottom: 10px; }

.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-secondary);
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}

.field label span {
  font-weight: 400;
  color: var(--text-muted);
  font-size: 11px;
}

.field .input-wrap { position: relative; }

.field input {
  width: 100%;
  padding: 12px 14px;
  background: var(--bg-secondary);
  border: 1.5px solid rgba(96, 96, 128, 0.25);
  border-radius: var(--radius-md);
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  outline: none;
  transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

.field input:hover { border-color: rgba(155, 0, 255, 0.35); }

.field input:focus {
  border-color: var(--neon-purple);
  box-shadow: 0 0 0 3px rgba(155, 0, 255, 0.12), 0 0 20px rgba(155, 0, 255, 0.15);
  background: var(--bg-card);
}

.field .suffix {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 600;
  pointer-events: none;
}

.note {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 6px;
  padding-left: 4px;
}

.btn-group {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}

.btn {
  flex: 1;
  padding: 14px 0;
  border: none;
  border-radius: 50px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  text-align: center;
  position: relative;
  overflow: hidden;
  letter-spacing: 1px;
}

.btn-primary {
  background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
  color: #fff;
  border: 2px solid var(--neon-purple);
}

.btn-primary::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  display: block;
  border-radius: 50px;
  background: rgba(255, 255, 255, 0.12);
  width: 50px;
  height: 50px;
  transition: all 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
}

.btn-primary:hover::before {
  width: 100%;
  background: rgba(255, 255, 255, 0.08);
}

.btn-primary:hover {
  box-shadow: 0 0 30px rgba(155, 0, 255, 0.4), 0 0 60px rgba(0, 45, 255, 0.25);
  transform: translateY(-2px);
}

.btn-primary:active { transform: scale(0.97); }

.btn-success {
  background: transparent;
  color: var(--neon-cyan);
  border: 2px solid var(--neon-cyan);
}

.btn-success::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  display: block;
  border-radius: 50px;
  background: rgba(0, 240, 255, 0.08);
  width: 50px;
  height: 50px;
  transition: all 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
}

.btn-success:hover::before {
  width: 100%;
  background: rgba(0, 240, 255, 0.12);
}

.btn-success:hover {
  box-shadow: 0 0 30px rgba(0, 240, 255, 0.35), inset 0 0 20px rgba(0, 240, 255, 0.08);
  transform: translateY(-2px);
}

.btn-success:active { transform: scale(0.97); }

.tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.tag-6 { background: rgba(0, 240, 255, 0.12); color: var(--neon-cyan); border: 1px solid rgba(0, 240, 255, 0.25); }
.tag-5 { background: rgba(0, 255, 136, 0.12); color: var(--neon-green); border: 1px solid rgba(0, 255, 136, 0.25); }
.tag-4 { background: rgba(255, 170, 0, 0.12); color: var(--warning); border: 1px solid rgba(255, 170, 0, 0.25); }
.tag-3 { background: rgba(255, 0, 128, 0.12); color: #ff0080; border: 1px solid rgba(255, 0, 128, 0.25); }
.tag-2 { background: rgba(255, 215, 0, 0.12); color: #ffd700; border: 1px solid rgba(255, 215, 0, 0.25); }
.tag-1 { background: rgba(255, 68, 102, 0.12); color: var(--danger); border: 1px solid rgba(255, 68, 102, 0.25); }

.result-card {
  background: var(--bg-card);
  border: 1px solid rgba(0, 240, 255, 0.15);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 14px;
  display: none;
  position: relative;
}

.result-card.show {
  display: block;
  animation: fadeInUp 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-header {
  background: linear-gradient(135deg, rgba(155, 0, 255, 0.15) 0%, rgba(0, 45, 255, 0.15) 100%);
  color: var(--text-primary);
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(155, 0, 255, 0.15);
  letter-spacing: 1px;
}

.result-body { padding: 12px 16px; }

.result-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid rgba(96, 96, 128, 0.12);
  font-size: 13px;
}

.result-row:last-child { border-bottom: none; }

.result-label { color: var(--text-secondary); font-weight: 500; }
.result-val { font-weight: 800; color: var(--text-primary); }

.result-val.big {
  font-size: 22px;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.result-val.dun {
  color: var(--neon-green);
  text-shadow: 0 0 10px rgba(0, 255, 136, 0.25);
}

.result-val.usd {
  color: #ffd700;
  text-shadow: 0 0 10px rgba(255, 215, 0, 0.25);
}

.copy-btn {
  background: rgba(96, 96, 128, 0.15);
  border: 1px solid rgba(96, 96, 128, 0.25);
  border-radius: 8px;
  padding: 5px 12px;
  font-size: 11px;
  color: var(--text-secondary);
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s ease;
}

.copy-btn:hover {
  background: rgba(155, 0, 255, 0.15);
  border-color: var(--neon-purple);
  color: var(--text-primary);
}

.copy-btn:active { transform: scale(0.95); }

.error-box {
  background: rgba(255, 68, 102, 0.08);
  border: 1px solid rgba(255, 68, 102, 0.25);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  margin-bottom: 14px;
  font-size: 13px;
  color: var(--danger);
  display: none;
  animation: shake 0.5s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

.history-card {
  background: var(--bg-card);
  border: 1px solid rgba(96, 96, 128, 0.15);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  margin-bottom: 14px;
  display: none;
}

.history-card.show {
  display: block;
  animation: fadeInUp 0.5s ease;
}

.history-card h3 {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid rgba(96, 96, 128, 0.12);
  font-size: 12px;
}

.history-item .h-price { font-weight: 800; color: var(--neon-cyan); }
.history-item .h-time { color: var(--text-muted); font-size: 11px; }
.history-item:last-child { border-bottom: none; }

.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
  color: #fff;
  padding: 10px 24px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  z-index: 999;
  pointer-events: none;
  box-shadow: 0 4px 20px rgba(155, 0, 255, 0.35);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.footer {
  text-align: center;
  padding: 16px;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 1px;
}

@media (min-width: 480px) {
  .container { padding: 20px 16px; }
}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>💎 钽铌矿计价器</h1>

    <div class="subtitle">Ta&#8322;O&#8325; / Nb&#8322;O&#8325; · CIF 到岸价 · 实时汇率</div>

  </div>



  <div class="price-card">

    <div class="price-label">

      <span class="dot" id="statusDot"></span>

      <span>SMM 上海有色网 · 30% 钽铌矿行情</span>

    </div>

    <div class="price-value" id="priceDisplay"><span class="spinner"></span></div>

    <div class="price-meta">

      <span id="priceTime">加载中...</span>

      <button class="refresh-btn" onclick="fetchPrice()">刷新</button>

    </div>

    <div class="manual-price" id="manualPriceRow" style="display:none">

      <span>手动：</span>

      <input type="number" id="manualPriceInput" placeholder="美元/磅" step="0.01">

      <button onclick="setManualPrice()">确定</button>

      <span class="toggle" onclick="resetPrice()">恢复默认</span>

    </div>

    <div class="manual-price" style="margin-top:6px">

      <span class="toggle" onclick="toggleManualPrice()" style="font-size:.7rem;color:var(--text2)">✎ 手动输入价格</span>

    </div>

    <div class="fx-row">

      <span>实时汇率 USD/CNY</span>

      <span class="fx-value" id="fxDisplay">加载中...</span>

    </div>

  </div>



  <div class="calc-card">

    <h2><span class="icon">🧮</span>计价计算</h2>

    <div class="grade-section">

      <div class="grade-label">

        <span class="name">钽铌矿品位 (Ta₂O₅+Nb₂O₅)</span>

        <span class="value" id="gradeValue">30<span class="pct">%</span></span>

      </div>

      <div class="slider-wrap">

        <input type="range" id="gradeSlider" min="1" max="50" value="30" step="0.1" oninput="updateCalc()">

      </div>

      <div class="grade-ticks"><span>1%</span><span>10%</span><span>20%</span><span>30%</span><span>40%</span><span>50%</span></div>

    </div>

    <div class="presets" id="gradePresets"></div>

    <div class="vat-section">

      <span class="label">增值税率</span>

      <input type="number" id="vatRate" value="13" min="0" max="20" step="0.5" onchange="updateCalc()">

      <span class="suffix">%</span>

    </div>

    <div class="results">

      <div class="result-item">

        <span class="r-label">CIF 到岸价</span>

        <span><span class="r-value" id="cifPrice">-</span> <span class="r-unit">美元/吨</span></span>

      </div>

      <div class="result-item">

        <span class="r-label">国内税前价</span>

        <span><span class="r-value" id="pretaxPrice">-</span> <span class="r-unit">元/吨</span></span>

      </div>

      <div class="result-item highlight">

        <span class="r-label">国内税后价</span>

        <span><span class="r-value" id="aftertaxPrice">-</span> <span class="r-unit">元/吨</span></span>

      </div>

      <div class="result-item">

        <span class="r-label">吨度价</span>

        <span><span class="r-value" id="tonDegreePrice">-</span> <span class="r-unit">元/吨度</span></span>

      </div>

    </div>

  </div>



  <div class="footer">

    <span>矿链通1.0</span>

    <span>-佛山鑫善源</span>

  </div>

</div>



<script>

var basePrice=232.5,exchangeRate=7.25,manualOverride=false,LBS_PER_TON=2204.6226;

function fetchPrice(){

  var d=document.getElementById("priceDisplay"),t=document.getElementById("priceTime"),dot=document.getElementById("statusDot");

  d.innerHTML='<span class="spinner"></span>';dot.style.background="#daa520";

  fetch("data/price.json?t="+Date.now()).then(function(r){return r.json()}).then(function(data){

    if(data.intl_price&&data.intl_price>0&&!manualOverride)basePrice=data.intl_price;

    if(data.exchange_rate&&data.exchange_rate>0){exchangeRate=data.exchange_rate;document.getElementById("fxDisplay").textContent=exchangeRate.toFixed(4)}

    d.innerHTML="$"+basePrice.toFixed(1)+'<span class="unit">/磅</span>';

    t.textContent=data.updated_at?"更新于 "+data.updated_at:"实时数据";

    dot.style.background="#4caf50";updateCalcDisplay()

  }).catch(function(){useDefaults(d,t,dot);fetchLiveFX()});

  fetchLiveFX()

}

function fetchLiveFX(){

  fetch("https://open.er-api.com/v6/latest/USD").then(function(r){return r.json()}).then(function(data){

    if(data.rates&&data.rates.CNY>0){exchangeRate=data.rates.CNY;document.getElementById("fxDisplay").textContent=exchangeRate.toFixed(4);updateCalcDisplay()}

  }).catch(function(){})

}

function useDefaults(d,t,dot){

  d.innerHTML="$"+basePrice.toFixed(1)+'<span class="unit">/磅</span>';

  t.innerHTML='<span class="price-error">离线模式 · 使用默认参考价</span>';

  document.getElementById("fxDisplay").textContent=exchangeRate.toFixed(4)+" (默认)";

  dot.style.background="#e05555";updateCalcDisplay()

}

function updateCalcDisplay(){if(!manualOverride)updateCalc()}

function setManualPrice(){

  var v=parseFloat(document.getElementById("manualPriceInput").value);

  if(v>0){basePrice=v;manualOverride=true;

    document.getElementById("priceDisplay").innerHTML="$"+v.toFixed(1)+'<span class="unit">/磅</span>';

    document.getElementById("priceTime").textContent="手动输入价格";updateCalc()}

}

function resetPrice(){manualOverride=false;fetchPrice()}

function toggleManualPrice(){

  var r=document.getElementById("manualPriceRow");

  r.style.display=r.style.display==="none"?"flex":"none"

}

function updateCalc(){

  var g=parseFloat(document.getElementById("gradeSlider").value);

  var vat=parseFloat(document.getElementById("vatRate").value)||0;

  document.getElementById("gradeValue").innerHTML=g.toFixed(1)+'<span class="pct">%</span>';

  updatePresetButtons(g);

  var cif=basePrice*LBS_PER_TON*(g/100);

  var pretax=cif*exchangeRate;

  var aftertax=pretax*(1+vat/100);

  var td=g>0?aftertax/g:0;

  document.getElementById("cifPrice").textContent=cif.toFixed(2);

  document.getElementById("pretaxPrice").textContent=pretax.toFixed(2);

  document.getElementById("aftertaxPrice").textContent=aftertax.toFixed(2);

  document.getElementById("tonDegreePrice").textContent=td.toFixed(2);

  updateMultiOres()

}

function buildPresetButtons(){

  var c=document.getElementById("gradePresets");

  [5,10,15,20,25,30,35,40,45,50].forEach(function(g){

    var b=document.createElement("button");b.textContent=g+"%";

    b.onclick=function(){document.getElementById("gradeSlider").value=g;updateCalc()};

    c.appendChild(b)

  })

}

function updatePresetButtons(grade){

  document.querySelectorAll("#gradePresets button").forEach(function(b){

    var g=parseInt(b.textContent);

    b.classList.toggle("active",Math.abs(g-grade)<0.05)

  })

}

var oreRows=[30,25,20];

function renderOreRows(){

  var l=document.getElementById("oreList");if(!l)return;l.innerHTML="";

  var vat=parseFloat(document.getElementById("vatRate").value)||0;

  oreRows.forEach(function(g,i){

    var cif=basePrice*LBS_PER_TON*(g/100),pretax=cif*exchangeRate,aftertax=pretax*(1+vat/100);

    l.innerHTML+='<div class="ore-row"><span style="font-size:.7rem;color:var(--text2)">品位</span>'

      +'<div class="ore-grade"><input type="number" value="'+g+'" min="1" max="50" step="0.1" onchange="updateOreGrade('+i+',this.value)">'

      +'<span style="font-size:.75rem;color:var(--text2)">%</span></div>'

      +'<div class="ore-result">¥'+aftertax.toFixed(0)+' /吨</div>'

      +'<button class="ore-del" onclick="removeOreRow('+i+')">×</button></div>'

  });updateTotal()

}

function addOreRow(){oreRows.push(30);document.getElementById("totalRow").style.display="flex";renderOreRows()}

function removeOreRow(i){oreRows.splice(i,1);if(oreRows.length<=1)document.getElementById("totalRow").style.display="none";renderOreRows()}

function updateOreGrade(i,v){var g=parseFloat(v);if(isNaN(g)||g<1)g=1;if(g>50)g=50;oreRows[i]=g;renderOreRows()}

function updateMultiOres(){renderOreRows()}

function updateTotal(){

  var total=0,vat=parseFloat(document.getElementById("vatRate").value)||0;

  oreRows.forEach(function(g){total+=basePrice*LBS_PER_TON*(g/100)*exchangeRate*(1+vat/100)});

  var e=document.getElementById("totalPrice");if(e)e.textContent="¥"+total.toFixed(0)+" /吨"

}

function init(){buildPresetButtons();updateCalc();fetchPrice();setInterval(fetchPrice,60000);setInterval(fetchLiveFX,300000)}

init();

</script>

</body>

</html>
